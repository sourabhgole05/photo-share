<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>📸 Photo Share Dashboard v2.0</title>

<style>
/* ==================== RESET & BASE ==================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0b1020;
  --card: #1a2340;
  --card-hover: #222d4f;
  --border: #2b3860;
  --text: #e8ecf8;
  --muted: #93a1c0;
  --accent1: #6d5ef0;
  --accent2: #b44df0;
  --accent3: #f05e9d;
  --shadow: 0 10px 40px rgba(0,0,0,.45);
  --radius: 14px;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(180,77,240,.15), transparent 60%),
    radial-gradient(1000px 500px at 0% 0%, rgba(109,94,240,.18), transparent 55%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ==================== HEADER ==================== */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(14px);
  background: rgba(11,16,32,.75);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.logo {
  font-size: 1.15rem;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ==================== HERO ==================== */
.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px 10px;
  text-align: center;
}
.hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; }
.hero p { color: var(--muted); margin-top: 8px; }

/* ==================== STATS ==================== */
.stats {
  max-width: 1200px;
  margin: 24px auto 0;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
}
.stat-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
}
.stat-box .num { font-size: 1.5rem; font-weight: 700; }
.stat-box .lbl { color: var(--muted); font-size: .8rem; margin-top: 2px; }

/* ==================== CONTROLS ==================== */
.controls {
  max-width: 1200px;
  margin: 20px auto 0;
  padding: 0 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: .9rem;
  outline: none;
  transition: border .2s;
}
.search-box input:focus { border-color: var(--accent1); }
.search-box .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  opacity: .6;
}
.category-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  padding: 8px 14px;
  border-radius: 50px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  font-size: .82rem;
  transition: all .2s;
}
.pill:hover { color: var(--text); border-color: var(--accent1); }
.pill.active {
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: #fff;
  border-color: transparent;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  font-size: .85rem;
  font-weight: 600;
  transition: all .2s;
}
.btn:hover { border-color: var(--accent1); transform: translateY(-1px); }
.btn.primary {
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  border-color: transparent;
}
.btn.primary:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* ==================== GALLERY ==================== */
.gallery {
  max-width: 1200px;
  margin: 24px auto 40px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.photo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform .25s, box-shadow .25s, border-color .25s;
  cursor: pointer;
}
.photo-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow);
  border-color: rgba(109,94,240,.5);
}
.photo-thumb {
  aspect-ratio: 4/3;
  overflow: hidden;
  position: relative;
  background: #0d1226;
}
.photo-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .4s;
}
.photo-card:hover .photo-thumb img { transform: scale(1.05); }
.photo-thumb .overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10,14,30,.5);
  opacity: 0;
  transition: opacity .25s;
  color: #fff;
  font-size: .85rem;
  gap: 6px;
}
.photo-thumb:hover .overlay { opacity: 1; }
.photo-info {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.photo-title {
  font-size: .88rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.photo-meta { display: flex; align-items: center; gap: 8px; }
.badge {
  background: rgba(109,94,240,.15);
  color: #a5b4fc;
  font-size: .7rem;
  padding: 3px 8px;
  border-radius: 50px;
  white-space: nowrap;
}
.dl-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  cursor: pointer;
  font-size: .85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.dl-btn:hover { background: var(--accent1); border-color: var(--accent1); }
.face-badge {
  background: rgba(240, 94, 157, .15);
  color: #f0a5c7;
  font-size: .7rem;
  padding: 3px 8px;
  border-radius: 50px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
}
.face-badge .face-icon {
  font-size: .8rem;
}

/* ==================== EMPTY / LOADING ==================== */
.state-msg {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--muted);
  padding: 60px 20px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent2);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ==================== LIGHTBOX ==================== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(5,8,20,.92);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 20px;
}
.lightbox.show { display: flex; }
.lightbox img {
  max-width: 92vw;
  max-height: 78vh;
  border-radius: 12px;
  box-shadow: var(--shadow);
  cursor: zoom-in;
}
.lightbox-info {
  margin-top: 12px;
  color: var(--muted);
  font-size: .9rem;
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}
.lightbox .close-btn,
.lightbox .nav-btn {
  position: fixed;
  z-index: 101;
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(26,35,64,.8);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
}
.lightbox .close-btn:hover,
.lightbox .nav-btn:hover { background: var(--accent1); border-color: var(--accent1); }
.close-btn { top: 18px; right: 18px; }
.nav-btn.prev { left: 16px; top: 50%; transform: translateY(-50%); }
.nav-btn.next { right: 16px; top: 50%; transform: translateY(-50%); }

/* ==================== SHARE MODAL ==================== */
.share-modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(5,8,20,.92);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.share-modal.show { display: flex; }
.share-content {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 30px;
  max-width: 500px;
  width: 100%;
  text-align: center;
  position: relative;
}
.share-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  font-size: 1rem;
}
.share-close:hover { background: var(--accent1); border-color: var(--accent1); }
.share-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 15px;
  margin: 20px 0;
}
.share-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all .2s;
}
.share-option:hover {
  background: var(--card-hover);
  border-color: var(--accent1);
}
.share-option .icon {
  font-size: 2rem;
  margin-bottom: 5px;
}
.share-url {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  margin: 15px 0;
  word-break: break-all;
  font-family: monospace;
  font-size: .85rem;
}
.copy-btn {
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: all .2s;
}
.copy-btn:hover {
  filter: brightness(1.1);
}

/* ==================== FOOTER ==================== */
footer {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  padding: 20px;
  border-top: 1px solid var(--border);
  margin-top: 20px;
}

/* ==================== NOTIFICATION ==================== */
.notification {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--accent1);
  color: white;
  padding: 15px 20px;
  border-radius: 8px;
  box-shadow: var(--shadow);
  z-index: 1000;
  transform: translateX(150%);
  transition: transform .3s;
  max-width: 300px;
}
.notification.show {
  transform: translateX(0);
}
.notification.success { background: #10b981; }
.notification.error { background: #ef4444; }
.notification.warning { background: #f59e0b; }
.notification.info { background: var(--accent1); }

/* ==================== RESPONSIVE ==================== */
@media (max-width: 640px) {
  .header-inner { justify-content: center; text-align: center; }
  .hero { padding-top: 28px; }
  .nav-btn.prev { left: 6px; }
  .nav-btn.next { right: 6px; }
  .lightbox img { max-height: 70vh; }
}
</style>
</head>
<body>

<!-- Version indicator for cache busting -->
<!-- Photo Share Dashboard v2.0 - Enhanced with Face Detection -->

<!-- ==================== HEADER ==================== -->
<header>
  <div class="header-inner">
    <div class="logo">📸 PhotoShare Dashboard v2.0</div>
    <div class="header-actions">
      <button class="btn primary" id="downloadAllBtn" onclick="downloadAll()">⬇ Download All</button>
    </div>
  </div>
</header>

<!-- ==================== HERO ==================== -->
<section class="hero">
  <h1 id="siteTitle">My Photo Collection</h1>
  <p id="siteDesc">Browse & download photos — free for everyone on any network</p>
</section>

<!-- ==================== STATS ==================== -->
<section class="stats">
  <div class="stat-box"><div class="num" id="statPhotos">0</div><div class="lbl">Photos</div></div>
  <div class="stat-box"><div class="num" id="statCats">0</div><div class="lbl">Categories</div></div>
  <div class="stat-box"><div class="num" id="statSource">—</div><div class="lbl">Source</div></div>
  <div class="stat-box"><div class="num" id="statSize">—</div><div class="lbl">Total Size</div></div>
</section>

<!-- ==================== CONTROLS ==================== -->
<section class="controls">
  <div class="search-box">
    <span class="icon">🔎</span>
    <input type="text" id="searchInput" placeholder="Search photos..." oninput="onSearch(this.value)">
  </div>
  <div class="category-pills" id="categoryPills"></div>
</section>

<!-- ==================== GALLERY ==================== -->
<section class="gallery" id="gallery"></section>

<!-- ==================== FOOTER ==================== -->
<footer>⚡ Hosted on <strong>GitHub Pages</strong> — Free forever | Enhanced with Face Detection</footer>

<!-- ==================== LIGHTBOX ==================== -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">
  <button class="close-btn" onclick="closeLightbox()" aria-label="Close">✕</button>
  <button class="nav-btn prev" onclick="prevPhoto()" aria-label="Previous">‹</button>
  <img id="lightboxImg" src="" alt="Photo preview" onclick="event.stopPropagation()">
  <button class="nav-btn next" onclick="nextPhoto()" aria-label="Next">›</button>
  <div class="lightbox-info">
    <span id="lightboxTitle"></span>
    <span id="lightboxCounter"></span>
    <button class="btn" onclick="downloadCurrent()">⬇ Download</button>
    <button class="btn" onclick="sharePhoto()">🔗 Share</button>
  </div>
</div>

<!-- ==================== SHARE MODAL ==================== -->
<div class="share-modal" id="shareModal" onclick="if(event.target===this) closeShareModal()">
  <div class="share-content">
    <button class="share-close" onclick="closeShareModal()" aria-label="Close">✕</button>
    <h3>Share This Photo</h3>
    <div class="share-options">
      <div class="share-option" onclick="shareViaWhatsApp()">
        <div class="icon">📱</div>
        <span>WhatsApp</span>
      </div>
      <div class="share-option" onclick="shareViaTelegram()">
        <div class="icon">✈️</div>
        <span>Telegram</span>
      </div>
      <div class="share-option" onclick="shareViaEmail()">
        <div class="icon">✉️</div>
        <span>Email</span>
      </div>
      <div class="share-option" onclick="copyShareLink()">
        <div class="icon">📋</div>
        <span>Copy Link</span>
      </div>
    </div>
    <div class="share-url" id="shareUrl"></div>
    <button class="copy-btn" onclick="copyShareLink()">Copy Link</button>
  </div>
</div>

<!-- Notification element -->
<div class="notification" id="notification"></div>

<!-- Face API Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection@1.0.1/dist/face-detection.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<!-- JSZip (only needed for "Download All as ZIP") -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
/* ==================================================================
   🔧 CONFIGURATION — edit these values!
   ================================================================== */

// Title & description shown on the page
const SITE_TITLE = "My Photo Collection";
const SITE_DESCRIPTION = "Browse & download photos — free for everyone on any network";

// If your GitHub Pages site is at https://USERNAME.github.io/REPO/
// leave BASE_PATH = "" — relative paths work automatically.
const BASE_PATH = "";

// 🤖 AUTO-DISCOVERY: fetch photos from a folder in your GitHub repo.
// Set to true if your repo is PUBLIC. Photos load from /PHOTO_FOLDER.
const USE_GITHUB_API = true;
const GITHUB_REPO   = "sourabhgole05/photo-share";   // e.g. "john/photo-share"
const GITHUB_BRANCH = "main";
const PHOTO_FOLDER  = "photos";

// 📝 MANUAL LIST — used when USE_GITHUB_API is false,
// or merged with API photos when true.
//    • Use paths RELATIVE to this file (e.g. "photos/pic1.jpg")
//    • Or any direct image URL (https://...)
//    • Choose a category name (used for filtering) — any string you like
const PHOTOS = [
  // { url: "photos/sunset.jpg", title: "Sunset", category: "Travel" },
  // { url: "photos/beach.jpg",  title: "Beach",  category: "Travel" },
  // { url: "photos/family.jpg", title: "Family", category: "Family" },
  // { url: "https://i.imgur.com/abc123.jpg", title: "Nature", category: "Nature" },
];

/* ==================================================================
   🧠 APP LOGIC — no need to edit below this line unless you want to
   ================================================================== */

let allPhotos      = [];
let filteredPhotos = [];
let activeCategory = "All";
let activeSearch   = "";
let currentSource  = "Manual";
let currentIndex   = 0;
let totalBytes     = 0;
let faceDetectionModel = null;
let faceDetectionSupported = false;
let isProcessingFaces = false;

const IMAGE_EXTENSIONS = ["jpg","jpeg","png","gif","webp","bmp","svg"];

// Initialize face detection
async function initFaceDetection() {
  try {
    showNotification("Loading face detection models...", "info");

    // Check if face-api.js is available
    if (typeof faceapi === 'undefined') {
      console.log("Face API not loaded");
      showNotification("Face detection unavailable", "error");
      return;
    }

    // Load models
    const MODEL_PATH = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';
    await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_PATH);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_PATH);
    await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_PATH);
    faceDetectionSupported = true;
    console.log("Face detection models loaded successfully");
    showNotification("Face detection ready!", "success");
  } catch (error) {
    console.error("Face detection initialization failed:", error);
    faceDetectionSupported = false;
    showNotification("Face detection failed to load", "error");
  }
}

// Detect faces in an image
async function detectFaces(imageUrl) {
  if (!faceDetectionSupported) return false;

  try {
    const img = new Image();
    img.crossOrigin = "anonymous";

    return new Promise((resolve) => {
      img.onload = async () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const detections = await faceapi.detectAllFaces(canvas);
          resolve(detections.length > 0);
        } catch (error) {
          console.error("Face detection error:", error);
          resolve(false);
        }
      };

      img.onerror = () => {
        resolve(false);
      };

      img.src = imageUrl;
    });
  } catch (error) {
    console.error("Face detection failed:", error);
    return false;
  }
}

function init() {
  document.getElementById("siteTitle").textContent = SITE_TITLE;
  document.getElementById("siteDesc").textContent  = SITE_DESCRIPTION;

  // Initialize face detection
  initFaceDetection();

  // Load photos
  if (USE_GITHUB_API) {
    loadFromGitHub().then(() => {
      // Merge manual photos (avoid duplicates by URL)
      mergeManualPhotos();
      // Process photos for face detection
      processPhotosForFaces();
      currentSource = "GitHub API" + (PHOTOS.length ? " + Manual" : "");
      buildAll();
    }).catch((error) => {
      console.error("GitHub API failed:", error);
      mergeManualPhotos();
      processPhotosForFaces();
      currentSource = "Manual only (API failed)";
      buildAll();
    });
  } else {
    mergeManualPhotos();
    processPhotosForFaces();
    buildAll();
  }
}

function mergeManualPhotos() {
  const existing = new Set(allPhotos.map(p => p.url));
  PHOTOS.forEach(p => {
    if (!existing.has(p.url)) allPhotos.push({ ...p });
  });
}

async function processPhotosForFaces() {
  if (!faceDetectionSupported || allPhotos.length === 0) return;

  if (isProcessingFaces) return;
  isProcessingFaces = true;

  // Show loading indicator
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = `
    <div class="state-msg">
      <div class="spinner"></div>
      <div>Processing photos for face detection...</div>
      <div style="margin-top: 10px; font-size: 0.9rem;">This may take a moment for many photos</div>
    </div>`;

  // Process photos in batches to avoid blocking
  const batchSize = 3;
  let processed = 0;

  for (let i = 0; i < allPhotos.length; i += batchSize) {
    const batch = allPhotos.slice(i, i + batchSize);
    await Promise.all(batch.map(async (photo) => {
      if (photo.hasFaces === undefined) {
        photo.hasFaces = await detectFaces(photo.url);
        processed++;
      }
    }));

    // Update progress periodically
    if (processed % 5 === 0 || processed === allPhotos.length) {
      showNotification(`Processed ${processed}/${allPhotos.length} photos for faces`, "info");
    }
  }

  isProcessingFaces = false;
  showNotification("Face detection complete!", "success");
  buildAll();
}

function buildAll() {
  buildCategories();
  renderGallery();
}

/* ---------- GitHub API auto-discovery ---------- */
async function loadFromGitHub() {
  const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${PHOTO_FOLDER}?ref=${GITHUB_BRANCH}`;
  const res = await fetch(apiUrl);
  if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
  const files = await res.json();

  const photos = files
    .filter(f => f.type === "file")
    .filter(f => IMAGE_EXTENSIONS.includes(f.name.split(".").pop().toLowerCase()))
    .map(f => ({
      url: f.download_url,
      title: f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " "),
      category: "Gallery",
      size: f.size || 0
    }));

  photos.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  totalBytes = photos.reduce((sum, p) => sum + p.size, 0);
  allPhotos.push(...photos);
}

/* ---------- Filters ---------- */
function getFiltered() {
  return allPhotos.filter(p => {
    const catOk = activeCategory === "All" || p.category === activeCategory;
    const q = activeSearch;
    const searchOk = !q ||
      (p.title || "").toLowerCase().includes(q) ||
      (p.category || "").toLowerCase().includes(q);
    return catOk && searchOk;
  });
}

function onSearch(value) {
  activeSearch = value.trim().toLowerCase();
  renderGallery();
}

function setCategory(cat, el) {
  activeCategory = cat;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  if (el) el.classList.add("active");
  renderGallery();
}

/* ---------- Categories ---------- */
function buildCategories() {
  const container = document.getElementById("categoryPills");
  container.innerHTML = "";

  const allPill = document.createElement("button");
  allPill.className = "pill active";
  allPill.textContent = `All (${allPhotos.length})`;
  allPill.addEventListener("click", () => setCategory("All", allPill));
  container.appendChild(allPill);

  const cats = [...new Set(allPhotos.map(p => p.category).filter(Boolean))];
  cats.forEach(cat => {
    const count = allPhotos.filter(p => p.category === cat).length;
    const pill = document.createElement("button");
    pill.className = "pill";
    pill.textContent = `${cat} (${count})`;
    pill.addEventListener("click", () => setCategory(cat, pill));
    container.appendChild(pill);
  });

  // Add face detection filter if supported
  if (faceDetectionSupported) {
    const facesPill = document.createElement("button");
    facesPill.className = "pill";
    facesPill.textContent = "👤 Faces";
    facesPill.addEventListener("click", () => {
      activeCategory = "Faces";
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      facesPill.classList.add("active");
      renderGallery();
    });
    container.appendChild(facesPill);

    const noFacesPill = document.createElement("button");
    noFacesPill.className = "pill";
    noFacesPill.textContent = "🚫 No Faces";
    noFacesPill.addEventListener("click", () => {
      activeCategory = "No Faces";
      document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
      noFacesPill.classList.add("active");
      renderGallery();
    });
    container.appendChild(noFacesPill);
  }
}

/* ---------- Gallery rendering ---------- */
function renderGallery() {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  let photosToRender = allPhotos;

  // Apply face filter if active
  if (activeCategory === "Faces") {
    photosToRender = photosToRender.filter(p => p.hasFaces);
  } else if (activeCategory === "No Faces") {
    photosToRender = photosToRender.filter(p => !p.hasFaces);
  } else {
    photosToRender = getFiltered();
  }

  filteredPhotos = photosToRender;

  if (filteredPhotos.length === 0) {
    gallery.innerHTML = `
      <div class="state-msg">
        <div style="font-size:2.5rem;margin-bottom:10px">📭</div>
        No photos to show yet.<br>
        <small>
          ${allPhotos.length === 0
            ? 'Open this file and add entries to the <b>PHOTOS</b> list (or set <b>USE_GITHUB_API = true</b> and configure your repo). See the 📘 instructions that came with this file.'
            : 'Try a different search or category.'}
        </small>
      </div>`;
    updateStats();
    return;
  }

  filteredPhotos.forEach((photo, idx) => {
    const card = document.createElement("div");
    card.className = "photo-card";

    // Thumbnail
    const thumb = document.createElement("div");
    thumb.className = "photo-thumb";
    const img = document.createElement("img");
    img.src = photo.url;
    img.alt = photo.title || "Photo";
    img.loading = "lazy";
    img.addEventListener("click", (e) => {
      e.stopPropagation();
      openLightbox(idx);
    });
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.textContent = "🔍 Click to view";
    thumb.appendChild(img);
    thumb.appendChild(overlay);

    // Info
    const info = document.createElement("div");
    info.className = "photo-info";
    const title = document.createElement("div");
    title.className = "photo-title";
    title.textContent = photo.title || "Photo";
    const meta = document.createElement("div");
    meta.className = "photo-meta";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = photo.category || "General";

    // Face detection badge
    if (photo.hasFaces) {
      const faceBadge = document.createElement("span");
      faceBadge.className = "face-badge";
      faceBadge.innerHTML = '<span class="face-icon">👤</span> Faces detected';
      meta.appendChild(faceBadge);
    }

    const dl = document.createElement("button");
    dl.className = "dl-btn";
    dl.title = "Download";
    dl.setAttribute("aria-label", "Download");
    dl.textContent = "⬇";
    dl.addEventListener("click", (e) => {
      e.stopPropagation();
      downloadImage(photo, idx);
    });
    meta.appendChild(badge);
    meta.appendChild(dl);

    info.appendChild(title);
    info.appendChild(meta);
    card.appendChild(thumb);
    card.appendChild(info);
    gallery.appendChild(card);
  });

  updateStats();
}

/* ---------- Stats ---------- */
function updateStats() {
  document.getElementById("statPhotos").textContent = allPhotos.length;
  const cats = new Set(allPhotos.map(p => p.category).filter(Boolean)).size;
  document.getElementById("statCats").textContent = cats;
  document.getElementById("statSource").textContent = currentSource;
  document.getElementById("statSize").textContent = formatBytes(totalBytes);
}

function formatBytes(bytes) {
  if (!bytes) return "—";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1048576).toFixed(2) + " MB";
}

/* ---------- Lightbox ---------- */
function openLightbox(index) {
  if (!filteredPhotos.length) return;
  currentIndex = index;
  updateLightbox();
  document.getElementById("lightbox").classList.add("show");
  document.body.style.overflow = "hidden";
  showNotification("Photo viewer opened", "info");
}

function closeLightbox() {
  document.getElementById("lightbox").classList.remove("show");
  document.body.style.overflow = "";
}

function updateLightbox() {
  const p = filteredPhotos[currentIndex];
  if (!p) return;
  document.getElementById("lightboxImg").src = p.url;
  document.getElementById("lightboxTitle").textContent = p.title || "Photo";
  document.getElementById("lightboxCounter").textContent = `${currentIndex + 1} / ${filteredPhotos.length}`;
}

function prevPhoto() {
  if (!filteredPhotos.length) return;
  currentIndex = (currentIndex - 1 + filteredPhotos.length) % filteredPhotos.length;
  updateLightbox();
}

function nextPhoto() {
  if (!filteredPhotos.length) return;
  currentIndex = (currentIndex + 1) % filteredPhotos.length;
  updateLightbox();
}

function downloadCurrent() {
  const p = filteredPhotos[currentIndex];
  if (p) downloadImage(p, currentIndex);
}

function sharePhoto() {
  const p = filteredPhotos[currentIndex];
  if (!p) return;

  // Create a shareable URL with the photo
  const shareUrl = window.location.href + '?photo=' + encodeURIComponent(p.url);
  document.getElementById("shareUrl").textContent = shareUrl;
  document.getElementById("shareModal").classList.add("show");
}

function closeShareModal() {
  document.getElementById("shareModal").classList.remove("show");
}

// Share functions
function shareViaWhatsApp() {
  const url = document.getElementById("shareUrl").textContent;
  const text = encodeURIComponent(`Check out this photo: ${url}`);
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

function shareViaTelegram() {
  const url = document.getElementById("shareUrl").textContent;
  const text = encodeURIComponent(`Check out this photo: ${url}`);
  window.open(`https://t.me/share/url?url=${text}`, '_blank');
}

function shareViaEmail() {
  const url = document.getElementById("shareUrl").textContent;
  const subject = encodeURIComponent("Photo Share");
  const body = encodeURIComponent(`Check out this photo: ${url}`);
  window.open(`mailto:?subject=${subject}&body=${body}`, '_blank');
}

function copyShareLink() {
  const url = document.getElementById("shareUrl").textContent;
  navigator.clipboard.writeText(url).then(() => {
    showNotification("Link copied to clipboard!", "success");
  }).catch(err => {
    console.error("Copy failed: ", err);
    // Fallback
    const textArea = document.createElement("textarea");
    textArea.value = url;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);
    showNotification("Link copied to clipboard!", "success");
  });
}

document.addEventListener("keydown", (e) => {
  if (document.getElementById("shareModal").classList.contains("show")) {
    if (e.key === "Escape") closeShareModal();
    return;
  }
  if (!document.getElementById("lightbox").classList.contains("show")) return;
  if (e.key === "Escape") {
    closeLightbox();
  }
  if (e.key === "ArrowLeft") prevPhoto();
  if (e.key === "ArrowRight") nextPhoto();
});

/* ---------- Download helpers ---------- */
function triggerDownload(url, filename) {
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}

async function downloadImage(photo, index) {
  const filenameBase = (photo.title || `photo-${index + 1}`).replace(/[^\w\-]+/g, "_");
  try {
    const res = await fetch(photo.url);
    if (!res.ok) throw new Error("fetch failed");
    const blob = await res.blob();
    const ext = (blob.type.split("/")[1] || "jpg").split(";")[0];
    triggerDownload(URL.createObjectURL(blob), `${filenameBase}.${ext}`);
    showNotification("Download started!", "success");
  } catch (e) {
    console.error("Download failed:", e);
    // CORS fallback: open in new tab so the user can save manually
    window.open(photo.url, "_blank");
    showNotification("Opening image in new tab for download", "info");
  }
}

/* ---------- Download all as ZIP ---------- */
async function downloadAll() {
  const list = getFiltered();
  if (list.length === 0) return;

  if (typeof JSZip === "undefined") {
    showNotification("ZIP library is still loading... please try again in a moment.", "error");
    return;
  }

  const btn = document.getElementById("downloadAllBtn");
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "⏳ Processing...";

  try {
    const zip = new JSZip();
    const usedNames = new Set();
    let failed = 0;

    for (let i = 0; i < list.length; i++) {
      btn.innerHTML = `⬇ Zipping ${i + 1}/${list.length}...`;
      try {
        const res = await fetch(list[i].url);
        if (!res.ok) throw new Error("fetch failed");
        const blob = await res.blob();
        const ext = (blob.type.split("/")[1] || "jpg").split(";")[0];

        let base = (list[i].title || `photo-${i + 1}`).replace(/[^\w\-]+/g, "_");
        let name = base;
        let n = 2;
        while (usedNames.has(name)) { name = `${base}_${n++}`; }
        usedNames.add(name);

        zip.file(`${name}.${ext}`, blob);
      } catch (e) {
        failed++;
      }
    }

    const content = await zip.generateAsync({ type: "blob" });
    triggerDownload(URL.createObjectURL(content), "photos.zip");
    showNotification("ZIP file downloaded successfully!", "success");

    if (failed > 0) {
      showNotification(`${failed} photo(s) could not be included (likely cross-origin restriction). You can still download those individually.`, "warning");
    }
  } catch (e) {
    console.error("ZIP creation failed:", e);
    showNotification("Something went wrong while creating the ZIP. Try downloading photos individually.", "error");
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

/* ---------- Notification system ---------- */
function showNotification(message, type = "info") {
  const notification = document.getElementById("notification");
  notification.textContent = message;
  notification.className = `notification show ${type}`;

  // Auto hide after 5 seconds
  setTimeout(() => {
    notification.classList.remove("show");
  }, 5000);
}

/* ---------- Start ---------- */
init();
</script>
